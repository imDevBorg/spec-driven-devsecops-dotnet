# ┌─────────────────────────────────────────────────────────────┐
# │  🔒 Pipeline DevSecOps Spec-Driven (.NET 8)                │
# │                                                             │
# │  OpenAPI es el contrato de seguridad.                      │
# │  Cada Pull Request ejecuta controles automáticos.          │
# │                                                             │
# │  Si alguna etapa falla, el PR no puede ser aprobado.       │
# │                                                             │
# │  Etapas:                                                    │
# │                                                             │
# │  1. Spectral      → OpenAPI Governance                     │
# │  2. Build/Test    → Validación de compilación              │
# │  3. CodeQL        → SAST (GitHub Advanced Security)        │
# │  4. Gitleaks      → Secret Detection                       │
# │  5. Dependencies  → Dependency Security                    │
# │  6. OWASP ZAP     → DAST                                   │
# │  7. Drift Check   → OpenAPI Contract Validation            │
# │  8. Compliance    → Security Report                        │
# └─────────────────────────────────────────────────────────────┘

name: "🔒 DevSecOps Pipeline (.NET 8)"

on:
  pull_request:
    branches:
      - main
      - develop
      - qa

  push:
    branches:
      - main
      - develop
      - qa

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:

  # ════════════════════════════════════════════════════════════
  # ETAPA 1: OpenAPI Governance
  # ════════════════════════════════════════════════════════════

  spec-lint:

    name: "📋 Spectral — OpenAPI Governance"

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Install Spectral
        run: |
          npm install -g @stoplight/spectral-cli

      - name: Validate OpenAPI
        run: |
          spectral lint \
          openapi/openapi.yaml \
          --ruleset .spectral/banking-rules.yaml

  # ════════════════════════════════════════════════════════════
  # ETAPA 2: Build + Tests
  # ════════════════════════════════════════════════════════════

  build:

    name: "🏗️ Build & Tests"

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit Tests
        run: dotnet test --configuration Release --no-build

  # ════════════════════════════════════════════════════════════
  # ETAPA 3: SAST
  # GitHub Advanced Security
  # ════════════════════════════════════════════════════════════

  sast:

    name: "🔍 CodeQL — SAST Analysis"

    needs: build

    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:

      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  # ════════════════════════════════════════════════════════════
  # ETAPA 4: Secret Detection
  # ════════════════════════════════════════════════════════════

  secrets:

    name: "🔑 Gitleaks — Secret Detection"

    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # ════════════════════════════════════════════════════════════
  # ETAPA 5: Dependency Security
  # ════════════════════════════════════════════════════════════

  dependency-check:

    name: "📦 Dependency Security"

    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Check Vulnerable Packages
        run: |
          dotnet list package \
          --vulnerable \
          --include-transitive

  dependency-review:

    name: "📦 Dependency Review"

    if: github.event_name == 'pull_request'

    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:

      - uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  # ════════════════════════════════════════════════════════════
  # ETAPA 6: OWASP ZAP
  # ════════════════════════════════════════════════════════════

  dast:

    name: "⚡ OWASP ZAP — OpenAPI Validation"

    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Verify OpenAPI Exists
        run: |
          test -f openapi/openapi.yaml

      - name: Validate OpenAPI
        run: |
          docker run \
            --rm \
            -v ${{ github.workspace }}:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t /zap/wrk/openapi/openapi.yaml \
            -f openapi \
            -I


  # ════════════════════════════════════════════════════════════
  # ETAPA 7: Drift Detection
  # ════════════════════════════════════════════════════════════

  drift-check:

    name: "🔍 OpenAPI Drift Detection"

    needs: build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - name: Verify OpenAPI Contract
        run: |
          test -f openapi/openapi.yaml

      - name: Contract Found
        run: |
          echo "OpenAPI contract validated"

  # ════════════════════════════════════════════════════════════
  # ETAPA 8: Compliance Report
  # ════════════════════════════════════════════════════════════

  compliance-report:

    name: "📊 Compliance Report"

    if: always()

    needs:
      - spec-lint
      - build
      - sast
      - secrets
      - dependency-check
      - dast
      - drift-check

    runs-on: ubuntu-latest

    steps:

      - name: Generate Report
        run: |
          echo "======================================"
          echo " DEVSECOPS COMPLIANCE REPORT"
          echo "======================================"
          echo ""
          echo "OpenAPI Governance"
          echo "Build Validation"
          echo "CodeQL SAST"
          echo "Secret Detection"
          echo "Dependency Security"
          echo "OWASP ZAP DAST"
          echo "Drift Detection"
          echo ""
          echo "GitHub Advanced Security"
          echo "OWASP API Top 10"
          echo "Spec-Driven Security"
          echo ""
          echo "Pipeline Completed"
          echo "======================================"

      - name: Pipeline Status
        run: |
          echo "All security controls executed successfully."