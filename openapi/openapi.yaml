openapi: 3.0.3

info:
  title: Banking API
  version: 1.0.0
  description: Banking API secured using JWT.

servers:
  - url: https://api.bank.local

components:

  securitySchemes:

    BearerAuth:

      type: http

      scheme: bearer

      bearerFormat: JWT

paths:

  /api/v1/auth/login:

    post:

      operationId: Login

      summary: Login

      description: Authenticate user and generate JWT token.

      tags:
        - Authentication

      responses:

        "200":
          description: Login successful

        "401":
          description: Unauthorized

        "403":
          description: Forbidden

        "429":
          description: Too many requests

  /api/v1/accounts/{id}/balance:

    get:

      operationId: GetBalance

      summary: Get account balance

      description: Returns balance for an account.

      tags:
        - Accounts

      security:
        - BearerAuth: []

      responses:

        "200":
          description: Success

        "401":
          description: Unauthorized

        "403":
          description: Forbidden

        "429":
          description: Too many requests

  /api/v1/accounts/{id}/transactions:

    get:

      operationId: GetTransactions

      summary: Transactions

      description: Returns account transactions.

      tags:
        - Accounts

      security:
        - BearerAuth: []

      responses:

        "200":
          description: Success

        "401":
          description: Unauthorized

        "403":
          description: Forbidden

        "429":
          description: Too many requests

  /api/v1/transfers:

    post:

      operationId: CreateTransfer

      summary: Transfer money

      description: Creates a transfer between accounts.

      tags:
        - Transfers

      security:
        - BearerAuth: []

      responses:

        "201":
          description: Created

        "401":
          description: Unauthorized

        "403":
          description: Forbidden

        "429":
          description: Too many requests